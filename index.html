<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cat Nyam</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1434022792706022" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <section class="topbar" aria-label="게임 정보">
      <div>
        <p class="eyebrow">cute catch mini game</p>
        <h1>Cat Nyam</h1>
      </div>
      <div class="profile" id="profileBox" hidden>
        <button class="profile-button" id="profileButton" type="button">
          <span id="currentUserName"></span>
        </button>
        <button class="ghost-button" id="logoutButton" type="button">로그아웃</button>
      </div>
    </section>

    <section class="auth-panel" id="authPanel">
      <div class="auth-copy">
        <p class="eyebrow">account</p>
        <h2 id="authTitle">로그인하고 츄르 랭킹에 도전하세요</h2>
        <p id="authDescription">아이디와 비밀번호를 입력해 시작합니다. 기록은 이 브라우저에 저장됩니다.</p>
      </div>
      <form class="auth-form" id="authForm">
        <label>
          <span>아이디</span>
          <input id="usernameInput" name="username" type="text" autocomplete="username" maxlength="16" required>
        </label>
        <label id="nicknameField" hidden>
          <span>닉네임</span>
          <input id="nicknameInput" name="nickname" type="text" autocomplete="nickname" maxlength="16">
        </label>
        <label>
          <span>비밀번호</span>
          <input id="passwordInput" name="password" type="password" autocomplete="current-password" maxlength="24" required>
        </label>
        <label class="remember-login" id="rememberLoginField">
          <input id="rememberLoginInput" name="rememberLogin" type="checkbox">
          <span>자동로그인</span>
        </label>
        <label id="confirmPasswordField" hidden>
          <span>비밀번호 확인</span>
          <input id="confirmPasswordInput" name="confirmPassword" type="password" autocomplete="new-password" maxlength="24">
        </label>
        <p class="form-message" id="authMessage" role="status"></p>
        <div class="auth-actions">
          <button class="primary-button" id="authSubmitButton" type="submit">로그인</button>
          <button class="secondary-button" id="signupButton" type="button">가입하기</button>
          <button class="ghost-button" id="loginModeButton" type="button" hidden>로그인으로</button>
        </div>
      </form>
    </section>

    <section class="game-layout" id="gamePanel" hidden>
      <div class="game-stage">
        <div class="hud" aria-label="현재 게임 상태">
          <div>
            <span>점수</span>
            <strong id="scoreText">0</strong>
          </div>
          <div>
            <span>남은 시간</span>
            <strong id="timeText">45</strong>
          </div>
          <div>
            <span>최고 기록</span>
            <strong id="bestText">0</strong>
          </div>
        </div>
        <div class="mode-strip" aria-label="활성 모드">
          <span class="mode-badge speed" id="speedModeBadge" hidden>우다다</span>
          <span class="mode-badge hide" id="hideModeBadge" hidden>숨숨집</span>
          <span class="mode-badge purr" id="purrModeBadge" hidden>골골송</span>
          <span class="mode-badge catnip" id="catnipModeBadge" hidden>캣닢</span>
        </div>
        <div class="canvas-wrap" id="canvasWrap">
          <canvas id="gameCanvas" width="900" height="560" aria-label="고양이가 떨어지는 츄르를 잡는 게임"></canvas>
          <button class="pause-button" id="pauseButton" type="button" aria-label="일시정지" hidden>
            <span></span>
            <span></span>
          </button>
          <div class="game-overlay" id="gameOverlay">
            <p class="overlay-result" id="overlayResult" hidden></p>
            <button class="primary-button" id="startButton" type="button">게임 시작</button>
            <div class="pause-actions" id="pauseActions" hidden>
              <button class="pause-action-button restart" id="pauseRestartButton" type="button">다시하기</button>
              <button class="pause-action-button home" id="pauseHomeButton" type="button">홈으로</button>
              <button class="pause-action-button resume" id="resumeButton" type="button">계속하기</button>
            </div>
            <div class="item-guide" id="itemGuide" aria-label="아이템별 점수">
              <span><i class="guide-icon normal"></i>츄르 +2</span>
              <span><i class="guide-icon gold"></i>황금 츄르 +5</span>
              <span><i class="guide-icon bomb"></i>폭탄 -3</span>
              <span><i class="guide-icon toy"></i>장난감</span>
              <span><i class="guide-icon box"></i>숨숨집</span>
              <span><i class="guide-icon hand"></i>집사의 손길</span>
              <span><i class="guide-icon catnip"></i>캣닢</span>
            </div>
          </div>
        </div>
        <div class="touch-controls" aria-label="모바일 이동 조작">
          <button class="touch-button" id="touchLeftButton" type="button" aria-label="왼쪽으로 이동">‹</button>
          <button class="touch-button" id="touchRightButton" type="button" aria-label="오른쪽으로 이동">›</button>
        </div>
      </div>

      <aside class="side-column">
        <section class="ranking-panel" id="rankingPanel">
          <div class="panel-header">
            <div>
              <p class="eyebrow">leaderboard</p>
              <h2>츄르 랭킹</h2>
            </div>
          </div>
          <div class="ranking-tabs" role="tablist" aria-label="랭킹 종류">
            <button class="ranking-tab active" id="dailyRankingButton" type="button" role="tab" aria-selected="true">일일랭킹</button>
            <button class="ranking-tab" id="allTimeRankingButton" type="button" role="tab" aria-selected="false">전체랭킹</button>
          </div>
          <ol class="ranking-list" id="rankingList"></ol>
        </section>
      </aside>
    </section>

    <section class="modal-backdrop" id="accountModal" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="accountModalTitle">
        <div class="modal-header">
          <div>
            <p class="eyebrow">account</p>
            <h2 id="accountModalTitle">계정 설정</h2>
          </div>
          <button class="modal-close-button" id="closeAccountModalButton" type="button" aria-label="계정 설정 닫기">×</button>
        </div>

        <div class="tab-list" role="tablist" aria-label="계정 설정 메뉴">
          <button class="tab-button active" id="passwordTabButton" type="button" role="tab" aria-controls="passwordTabPanel" aria-selected="true">내 정보</button>
          <button class="tab-button" id="adminTabButton" type="button" role="tab" aria-controls="adminTabPanel" aria-selected="false" hidden>계정 관리</button>
        </div>

        <section class="tab-panel" id="passwordTabPanel" role="tabpanel" aria-labelledby="passwordTabButton">
          <form class="account-form username-form" id="changeUsernameForm">
            <label>
              <span>새 아이디</span>
              <input id="newUsernameInput" name="newUsername" type="text" autocomplete="username" maxlength="16" required>
            </label>
            <p class="form-message" id="usernameMessage" role="status"></p>
            <button class="secondary-button" type="submit">아이디 변경</button>
          </form>

          <form class="account-form nickname-form" id="changeNicknameForm">
            <label>
              <span>새 닉네임</span>
              <input id="newNicknameInput" name="newNickname" type="text" autocomplete="nickname" maxlength="16" required>
            </label>
            <p class="form-message" id="nicknameMessage" role="status"></p>
            <button class="secondary-button" type="submit">닉네임 변경</button>
          </form>

          <form class="account-form password-form" id="changePasswordForm">
            <label>
              <span>현재 비밀번호</span>
              <input id="currentPasswordInput" name="currentPassword" type="password" autocomplete="current-password" maxlength="24" required>
            </label>
            <label>
              <span>새 비밀번호</span>
              <input id="newPasswordInput" name="newPassword" type="password" autocomplete="new-password" maxlength="24" required>
            </label>
            <label>
              <span>새 비밀번호 확인</span>
              <input id="newPasswordConfirmInput" name="newPasswordConfirm" type="password" autocomplete="new-password" maxlength="24" required>
            </label>
            <p class="form-message" id="passwordMessage" role="status"></p>
            <button class="secondary-button" type="submit">변경하기</button>
          </form>

          <div class="account-danger-zone">
            <button class="secondary-button" id="resetMyScoreButton" type="button">내 점수 초기화</button>
            <button class="danger-button" id="deleteMyAccountButton" type="button">탈퇴</button>
            <p class="form-message" id="accountActionMessage" role="status"></p>
          </div>
        </section>

        <section class="tab-panel" id="adminTabPanel" role="tabpanel" aria-labelledby="adminTabButton" hidden>
          <p class="admin-note">비밀번호 초기화 시 임시 비밀번호가 화면에 표시됩니다.</p>
          <button class="danger-button admin-reset-rank-button" id="resetRankingButton" type="button">츄르랭킹 초기화</button>
          <div class="admin-list" id="adminList"></div>
          <p class="form-message" id="adminMessage" role="status"></p>
        </section>
      </div>
    </section>

    <section class="modal-backdrop" id="playerHistoryModal" hidden>
      <div class="modal player-history-modal" role="dialog" aria-modal="true" aria-labelledby="playerHistoryTitle">
        <div class="modal-header">
          <div>
            <p class="eyebrow">play log</p>
            <h2 id="playerHistoryTitle">플레이 기록</h2>
          </div>
          <button class="modal-close-button" id="closePlayerHistoryButton" type="button" aria-label="플레이 기록 닫기">×</button>
        </div>
        <div class="player-history-body">
          <p class="player-history-summary" id="playerHistorySummary"></p>
          <ol class="player-history-list" id="playerHistoryList"></ol>
          <p class="form-message" id="playerHistoryMessage" role="status"></p>
        </div>
      </div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
