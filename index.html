<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cat Nyam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <section class="topbar" aria-label="게임 정보">
      <div>
        <p class="eyebrow">cute catch mini game</p>
        <h1>Cat Nyam</h1>
      </div>
      <div class="profile" id="profileBox" hidden>
        <button class="profile-button" id="profileButton" type="button">
          <span id="currentUserName"></span>
        </button>
        <button class="ghost-button" id="logoutButton" type="button">로그아웃</button>
      </div>
    </section>

    <section class="auth-panel" id="authPanel">
      <div class="auth-copy">
        <p class="eyebrow">account</p>
        <h2 id="authTitle">로그인하고 츄르 랭킹에 도전하세요</h2>
        <p id="authDescription">아이디와 비밀번호를 입력해 시작합니다. 기록은 이 브라우저에 저장됩니다.</p>
      </div>
      <form class="auth-form" id="authForm">
        <label>
          <span>아이디</span>
          <input id="usernameInput" name="username" type="text" autocomplete="username" maxlength="16" required>
        </label>
        <label>
          <span>비밀번호</span>
          <input id="passwordInput" name="password" type="password" autocomplete="current-password" maxlength="24" required>
        </label>
        <label id="confirmPasswordField" hidden>
          <span>비밀번호 확인</span>
          <input id="confirmPasswordInput" name="confirmPassword" type="password" autocomplete="new-password" maxlength="24">
        </label>
        <p class="form-message" id="authMessage" role="status"></p>
        <div class="auth-actions">
          <button class="primary-button" id="authSubmitButton" type="submit">로그인</button>
          <button class="secondary-button" id="signupButton" type="button">가입하기</button>
          <button class="ghost-button" id="loginModeButton" type="button" hidden>로그인으로</button>
        </div>
      </form>
    </section>

    <section class="game-layout" id="gamePanel" hidden>
      <div class="game-stage">
        <div class="hud" aria-label="현재 게임 상태">
          <div>
            <span>점수</span>
            <strong id="scoreText">0</strong>
          </div>
          <div>
            <span>남은 시간</span>
            <strong id="timeText">45</strong>
          </div>
          <div>
            <span>최고 기록</span>
            <strong id="bestText">0</strong>
          </div>
        </div>
        <canvas id="gameCanvas" width="900" height="560" aria-label="고양이가 떨어지는 츄르를 잡는 게임"></canvas>
        <div class="control-row">
          <button class="primary-button" id="startButton" type="button">게임 시작</button>
        </div>
        <div class="touch-controls" aria-label="모바일 이동 조작">
          <button class="touch-button" id="touchLeftButton" type="button" aria-label="왼쪽으로 이동">‹</button>
          <button class="touch-button" id="touchRightButton" type="button" aria-label="오른쪽으로 이동">›</button>
        </div>
      </div>

      <aside class="side-column">
        <section class="ranking-panel" id="rankingPanel">
          <div class="panel-header">
            <div>
              <p class="eyebrow">leaderboard</p>
              <h2>츄르 랭킹</h2>
            </div>
          </div>
          <ol class="ranking-list" id="rankingList"></ol>
        </section>
      </aside>
    </section>

    <section class="modal-backdrop" id="accountModal" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="accountModalTitle">
        <div class="modal-header">
          <div>
            <p class="eyebrow">account</p>
            <h2 id="accountModalTitle">계정 설정</h2>
          </div>
          <button class="modal-close-button" id="closeAccountModalButton" type="button" aria-label="계정 설정 닫기">×</button>
        </div>

        <div class="tab-list" role="tablist" aria-label="계정 설정 메뉴">
          <button class="tab-button active" id="passwordTabButton" type="button" role="tab" aria-controls="passwordTabPanel" aria-selected="true">비밀번호 변경</button>
          <button class="tab-button" id="adminTabButton" type="button" role="tab" aria-controls="adminTabPanel" aria-selected="false" hidden>계정 관리</button>
        </div>

        <section class="tab-panel" id="passwordTabPanel" role="tabpanel" aria-labelledby="passwordTabButton">
          <form class="account-form" id="changePasswordForm">
            <label>
              <span>현재 비밀번호</span>
              <input id="currentPasswordInput" name="currentPassword" type="password" autocomplete="current-password" maxlength="24" required>
            </label>
            <label>
              <span>새 비밀번호</span>
              <input id="newPasswordInput" name="newPassword" type="password" autocomplete="new-password" maxlength="24" required>
            </label>
            <label>
              <span>새 비밀번호 확인</span>
              <input id="newPasswordConfirmInput" name="newPasswordConfirm" type="password" autocomplete="new-password" maxlength="24" required>
            </label>
            <p class="form-message" id="passwordMessage" role="status"></p>
            <button class="secondary-button" type="submit">변경하기</button>
          </form>
        </section>

        <section class="tab-panel" id="adminTabPanel" role="tabpanel" aria-labelledby="adminTabButton" hidden>
          <p class="admin-note">비밀번호 초기화 시 임시 비밀번호가 화면에 표시됩니다.</p>
          <div class="admin-list" id="adminList"></div>
          <p class="form-message" id="adminMessage" role="status"></p>
        </section>
      </div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
